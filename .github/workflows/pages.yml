name: Test and publish demo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.6'
      - name: Run offline test suite
        run: python -m unittest discover -s tests -v
      - name: Build and verify the demo pack
        run: |
          python -m tracepack build demo/evidence --output ci-output --title "CI demo" --force
          python -m tracepack verify ci-output
          test -f ci-output/case_pack.html
          test -f ci-output/evidence/network-diagram.svg
      - name: Build and smoke-test Docker image
        run: |
          docker build -t tracepack-ci .
          docker run --rm tracepack-ci

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.6'
      - name: Build static demo pack
        run: python -m tracepack build demo/evidence --output site --title "TracePack demo" --force
      - name: Make the demo the Pages landing page
        run: cp site/case_pack.html site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
